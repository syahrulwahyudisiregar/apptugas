<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guru Terfavorit</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#1e3a8a 0%,#0f172a 65%)}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;padding:2.5vh 3vw 2vh}
h1{margin:0;text-align:center;font-size:clamp(24px,4.4vw,56px);letter-spacing:1px;text-shadow:0 0 24px rgba(251,191,36,.45)}
#pesan{margin:1.2vh 0 0;text-align:center;font-size:clamp(15px,2.2vw,28px);color:#94a3b8}
.panggung{flex:1;width:100%;max-width:1100px;display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,1.6vw,22px);min-height:0}
.kol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.kol.k1{flex:1.3}
.piala{width:clamp(70px,13vw,170px);opacity:.22;margin-bottom:1vh;transition:opacity .8s}
.piala svg{display:block;width:100%;height:auto}
.k1.muncul .piala{opacity:1;animation:sinar 1.6s ease-in-out infinite}
@keyframes sinar{0%,100%{filter:drop-shadow(0 0 8px #fbbf24)}50%{filter:drop-shadow(0 0 30px #fde047)}}
.isi{width:100%;text-align:center;padding:0 4px 1.2vh;min-height:9vh;display:flex;flex-direction:column;justify-content:flex-end;opacity:0;transform:translateY(40px) scale(.7);transition:opacity .9s,transform .9s cubic-bezier(.2,1.4,.4,1)}
.muncul .isi{opacity:1;transform:none}
.label{font-size:clamp(11px,1.5vw,20px);letter-spacing:3px;color:#cbd5e1;margin-bottom:.4vh}
.nama{font-weight:800;line-height:1.2;word-break:break-word;margin:.2vh 0;font-size:clamp(15px,2.3vw,30px)}
.k1 .nama{font-size:clamp(20px,3.7vw,48px);color:#fde68a;text-shadow:0 0 18px rgba(251,191,36,.7)}
.k1 .label{color:#fbbf24;font-size:clamp(14px,2.2vw,30px);font-weight:800}
.nama.kosong{color:#64748b;font-weight:600}
.suara{font-size:clamp(11px,1.5vw,18px);color:#94a3b8;margin-top:.4vh}
.blok{width:100%;border-radius:14px 14px 0 0;display:flex;justify-content:center;align-items:flex-start;padding-top:1.2vh;font-weight:900;font-size:clamp(34px,7vw,96px);color:rgba(15,23,42,.75);opacity:.35;transition:opacity .9s}
.muncul .blok{opacity:1}
.k1 .blok{height:30vh;background:linear-gradient(180deg,#fde68a,#d97706)}
.k2 .blok{height:22vh;background:linear-gradient(180deg,#e2e8f0,#64748b)}
.k3 .blok{height:15vh;background:linear-gradient(180deg,#fdba74,#9a3412)}
#pm{margin-top:1.4vh;font-size:clamp(11px,1.5vw,16px);color:#64748b}
#hm{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(15,23,42,.94)}
#jl{font-size:clamp(28px,6vw,80px);font-weight:800;color:#fff;letter-spacing:2px}
#ang{font-size:clamp(140px,34vw,420px);font-weight:900;line-height:1;color:#fbbf24;text-shadow:0 0 50px rgba(251,191,36,.7)}
#ang.pop{animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(2.2);opacity:0}25%{opacity:1}100%{transform:scale(1);opacity:1}}
#fx{position:fixed;inset:0;z-index:60;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Guru Terfavorit</h1>
  <div id="pesan">Menunggu pengumuman juara...</div>
  <div class="panggung">
    <div class="kol k3" id="k3"><div class="isi" id="i3"></div><div class="blok">3</div></div>
    <div class="kol k1" id="k1">
      <div class="piala"><svg viewBox="0 0 200 230" aria-hidden="true">
        <defs><linearGradient id="em" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset=".5" stop-color="#f59e0b"/><stop offset="1" stop-color="#b45309"/></linearGradient></defs>
        <path d="M50 34H26c0 34 12 52 34 58" fill="none" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
        <path d="M150 34h24c0 34-12 52-34 58" fill="none" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
        <path d="M50 20h100v60c0 34-22 58-50 58S50 114 50 80z" fill="url(#em)"/>
        <rect x="90" y="136" width="20" height="40" fill="url(#em)"/>
        <path d="M60 176h80l10 28H50z" fill="url(#em)"/>
        <rect x="46" y="204" width="108" height="16" rx="4" fill="#b45309"/>
        <path d="M100 42l8 17 19 3-14 13 4 19-17-9-17 9 4-19-14-13 19-3z" fill="#fff7d6"/>
      </svg></div>
      <div class="isi" id="i1"></div><div class="blok">1</div>
    </div>
    <div class="kol k2" id="k2"><div class="isi" id="i2"></div><div class="blok">2</div></div>
  </div>
  <div id="pm"></div>
</div>
<div id="hm"><div id="jl"></div><div id="ang"></div></div>
<canvas id="fx"></canvas>
<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbwI0ZmnStm9K8N5d54A6ZdctFu9hcX2v2G_k3XRIO_7tWkS5kaHjM95Z-u3igTRd4QrgA/exec';
var tahapTampil = -1, sibuk = false;
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function tunggu(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

/* ---------- Panggung ---------- */
function isiTempat(p, juara) {
  var arr = (juara && juara[p]) || [];
  $('i' + p).innerHTML = '<div class="label">JUARA ' + p + '</div>' +
    (arr.length
      ? arr.map(function (x) { return '<div class="nama">' + esc(x.nama) + '</div>'; }).join('') + '<div class="suara">' + arr[0].suara + ' suara</div>'
      : '<div class="nama kosong">Tidak ada</div>');
}
function tampilTempat(p, on) { $('k' + p).classList.toggle('muncul', on); }
function kosongkan() { for (var p = 1; p <= 3; p++) { tampilTempat(p, false); $('i' + p).innerHTML = ''; } }

/* ---------- Hitungan mundur 5 sampai 1 ---------- */
function hitungMundur(p) {
  var ov = $('hm'), an = $('ang'), n = 5;
  $('jl').textContent = 'Juara ' + p; ov.style.display = 'flex';
  function langkah() {
    if (n < 1) { ov.style.display = 'none'; return Promise.resolve(); }
    an.textContent = n; an.classList.remove('pop'); void an.offsetWidth; an.classList.add('pop'); n--;
    return tunggu(1000).then(langkah);
  }
  return langkah();
}

/* ---------- Kembang api dan konfeti ---------- */
var cv = $('fx'), cx = cv.getContext('2d'), P = [], jalan = false;
var WARNA = ['#fbbf24', '#f87171', '#60a5fa', '#34d399', '#f472b6', '#a78bfa', '#fde047', '#ffffff'];
function ukur() { cv.width = window.innerWidth; cv.height = window.innerHeight; }
ukur(); window.addEventListener('resize', ukur);
function acak(a, b) { return a + Math.random() * (b - a); }
function mulai() { if (!jalan) { jalan = true; requestAnimationFrame(gambar); } }
function meledak(x, y, n) {
  var w = WARNA[Math.floor(Math.random() * WARNA.length)], i, a, v;
  for (i = 0; i < n; i++) {
    a = Math.random() * Math.PI * 2; v = acak(1.2, 6);
    P.push({ t: 'f', x: x, y: y, px: x, py: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, l: 1, d: acak(.006, .016), c: Math.random() < .2 ? '#ffffff' : w, s: acak(1.5, 3.2) });
  }
  mulai();
}
function konfeti(n) {
  for (var i = 0; i < n; i++) P.push({ t: 'k', x: acak(0, cv.width), y: acak(-cv.height * .5, -10), vx: acak(-1, 1), vy: acak(2, 5), r: acak(0, 6), vr: acak(-.25, .25), w: acak(6, 12), h: acak(4, 8), c: WARNA[Math.floor(Math.random() * WARNA.length)] });
  mulai();
}
function gambar() {
  cx.clearRect(0, 0, cv.width, cv.height);
  P = P.filter(function (p) {
    if (p.t === 'f') {
      p.px = p.x; p.py = p.y; p.vy += .05; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.l -= p.d;
      if (p.l <= 0) return false;
      cx.globalAlpha = p.l; cx.strokeStyle = p.c; cx.lineWidth = p.s; cx.lineCap = 'round';
      cx.beginPath(); cx.moveTo(p.px, p.py); cx.lineTo(p.x, p.y); cx.stroke();
      return true;
    }
    p.x += p.vx + Math.sin(p.y / 30); p.y += p.vy; p.r += p.vr;
    if (p.y > cv.height + 20) return false;
    cx.globalAlpha = 1; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore();
    return true;
  });
  cx.globalAlpha = 1;
  if (P.length) requestAnimationFrame(gambar); else { jalan = false; cx.clearRect(0, 0, cv.width, cv.height); }
}
function kembangApi(besar) {
  var n = besar ? 18 : 5, i;
  for (i = 0; i < n; i++) (function (k) {
    setTimeout(function () { meledak(cv.width * acak(.12, .88), cv.height * acak(.1, .55), besar ? 120 : 70); }, k * (besar ? 360 : 450));
  })(i);
  if (besar) { konfeti(170); setTimeout(function () { konfeti(130); }, 2600); }
}

/* ---------- Mengumumkan juara ---------- */
function umumkan(level, juara, cepat) {   // tahap 1 = juara 3, 2 = juara 2, 3 = juara 1
  var p = 4 - level;
  isiTempat(p, juara);
  if (cepat) { tampilTempat(p, true); return Promise.resolve(); }
  return hitungMundur(p).then(function () {
    tampilTempat(p, true); kembangApi(p === 1);
    return tunggu(p === 1 ? 7000 : 3200);
  });
}
function proses(r) {
  $('pm').textContent = r.pemilih + ' murid sudah memilih';
  if (sibuk) return;
  var t = r.tahap, l;
  $('pesan').style.display = t === 0 ? '' : 'none';
  if (tahapTampil < 0 || t < tahapTampil) {
    kosongkan();
    for (l = 1; l <= t; l++) umumkan(l, r.juara, true);
    tahapTampil = t; return;
  }
  if (t > tahapTampil) {
    for (l = tahapTampil + 1; l < t; l++) umumkan(l, r.juara, true);
    tahapTampil = t; sibuk = true;
    umumkan(t, r.juara, false).then(function () { sibuk = false; });
  }
}

/* ---------- Mengambil data dari server tiap 2 detik ---------- */
function muat() {
  fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ aksi: 'votingHasil' })
  }).then(function (r) { return r.json(); }).then(function (r) {
    if (r && r.ok) proses(r);
  }).catch(function () {})
    .then(function () { setTimeout(muat, 2000); });
}
muat();
</script>
</body>
</html>
